<svg viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Space Gradient -->
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#091426"/>
      <stop offset="60%" stop-color="#040914"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <!-- Atmospheric Glow -->
    <radialGradient id="atmoGlow" cx="68%" cy="55%" r="45%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.45)"/>
      <stop offset="35%" stop-color="rgba(6, 182, 212, 0.25)"/>
      <stop offset="65%" stop-color="rgba(16, 185, 129, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <!-- Planet Limb Glow -->
    <linearGradient id="limbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="80%" stop-color="#032b5f"/>
      <stop offset="100%" stop-color="#010e24"/>
    </linearGradient>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos -->
  <rect width="1920" height="1080" fill="url(#spaceGrad)"/>

  <!-- Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1"/>
    <circle cx="280" cy="190" r="1.5" opacity="0.8"/>
    <circle cx="450" cy="90" r="0.8"/>
    <circle cx="700" cy="140" r="1.2"/>
    <circle cx="950" cy="70" r="1"/>
    <circle cx="1200" cy="120" r="1.6" opacity="0.9"/>
    <circle cx="1450" cy="80" r="0.8"/>
    <circle cx="1700" cy="160" r="1.4"/>
    <circle cx="1820" cy="90" r="1.1"/>
    <circle cx="150" cy="400" r="1.2"/>
    <circle cx="320" cy="600" r="0.9"/>
    <circle cx="210" cy="850" r="1.5"/>
    <circle cx="1750" cy="650" r="1.2"/>
    <circle cx="1600" cy="900" r="1"/>
    <circle cx="1850" cy="450" r="1.4"/>
  </g>

  <!-- Giant Earth Curved Horizon -->
  <circle cx="1450" cy="1050" r="950" fill="#050e1c"/>
  <circle cx="1450" cy="1050" r="950" fill="url(#limbGlow)" opacity="0.6"/>
  
  <!-- Atmospheric Limb -->
  <circle cx="1450" cy="1050" r="955" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.85"/>
  <circle cx="1450" cy="1050" r="962" fill="none" stroke="#00f0ff" stroke-width="8" opacity="0.35"/>
  <circle cx="1450" cy="1050" r="980" fill="none" stroke="#38bdf8" stroke-width="24" opacity="0.12"/>

  <!-- Atmospheric Haze -->
  <rect width="1920" height="1080" fill="url(#atmoGlow)"/>

  <!-- Continental Landmasses & Night City Lights -->
  <g filter="url(#cityGlow)">
    <!-- Indian Subcontinent Outline & Major River Coastline Lights -->
    <!-- Mumbai / Western Coast -->
    <circle cx="980" cy="680" r="3" fill="#fed7aa"/>
    <circle cx="990" cy="710" r="2.5" fill="#fdba74"/>
    <circle cx="1005" cy="740" r="2" fill="#fb923c"/>
    <!-- Bengaluru / Southern Hub -->
    <circle cx="1060" cy="780" r="3.5" fill="#fef08a"/>
    <circle cx="1080" cy="770" r="2.5" fill="#fed7aa"/>
    <circle cx="1110" cy="760" r="3" fill="#fed7aa"/> <!-- Chennai -->
    
    <!-- Godavari Delta & Eastern Coast Focus (Pravah 360 Focus Area) -->
    <!-- Hyderabad / Krishna-Godavari inland basin -->
    <circle cx="1080" cy="690" r="4" fill="#fef08a"/>
    <circle cx="1095" cy="685" r="2" fill="#fed7aa"/>
    <!-- Vijayawada / Amaravati -->
    <circle cx="1130" cy="715" r="3" fill="#fde047"/>
    <!-- Rajamahendravaram (Rajahmundry) - Godavari Apex -->
    <circle cx="1165" cy="695" r="4" fill="#38bdf8"/>
    <circle cx="1165" cy="695" r="9" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <circle cx="1165" cy="695" r="16" stroke="#00f0ff" stroke-width="0.75" opacity="0.4"/>
    <!-- Kakinada Port / Coastal Apex -->
    <circle cx="1190" cy="685" r="2.5" fill="#67e8f9"/>
    <!-- Visakhapatnam Harbor -->
    <circle cx="1220" cy="660" r="3.5" fill="#fde047"/>
    
    <!-- Connecting Golden Arterial Highways -->
    <path d="M1080 690 Q 1120 705 1165 695" stroke="#fed7aa" stroke-width="1.5" opacity="0.7"/>
    <path d="M1165 695 L 1190 685" stroke="#67e8f9" stroke-width="1.8" opacity="0.8"/>
    <path d="M1190 685 L 1220 660" stroke="#fde047" stroke-width="1.5" opacity="0.7"/>
    <path d="M1130 715 Q 1150 705 1165 695" stroke="#fde047" stroke-width="1.5" opacity="0.75"/>
  </g>

  <!-- Orbital Data Vectors & Geospatial Grid Lines -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="0.75" fill="none">
    <path d="M600 300 Q 1000 450 1500 500" stroke-dasharray="6 4"/>
    <path d="M750 200 Q 1150 350 1650 400" stroke-dasharray="6 4"/>
    <path d="M900 100 Q 1300 250 1800 300" stroke-dasharray="6 4"/>
  </g>
</svg>