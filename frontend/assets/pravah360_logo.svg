<svg viewBox="0 0 240 60" width="240" height="60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <!-- Emblem -->
  <g transform="translate(6, 6)">
    <!-- Orbital Ring -->
    <circle cx="24" cy="24" r="22" stroke="url(#pGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Planet Base -->
    <circle cx="24" cy="24" r="18" fill="#081426" stroke="#1e3a5f" stroke-width="1.2"/>
    <!-- River Waves / Pravah Curves -->
    <path d="M10 23C15 19 20 27 26 22C31 17 35 23 38 21" stroke="url(#flowGrad)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M12 28C16 25 21 31 27 27C32 23 35 28 37 26" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M15 18C18 15 22 19 27 16C31 13 33 17 35 15" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    <!-- Orbit Ellipse -->
    <ellipse cx="24" cy="24" rx="23" ry="8" stroke="url(#pGrad)" stroke-width="1.2" transform="rotate(-28 24 24)" opacity="0.8"/>
    <!-- Satellite Beacon -->
    <circle cx="41" cy="11" r="2.5" fill="#38bdf8"/>
    <circle cx="41" cy="11" r="5" stroke="#38bdf8" stroke-width="0.75" opacity="0.5"/>
  </g>
  <!-- Wordmark -->
  <text x="68" y="33" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" letter-spacing="1.5" fill="#f8fafc">
    PRAVAH <tspan fill="#38bdf8">360</tspan>
  </text>
  <text x="69" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" letter-spacing="2" fill="#94a3b8">
    DISASTER INTELLIGENCE
  </text>
</svg>