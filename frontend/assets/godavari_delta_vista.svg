<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep space / ocean gradient -->
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17"/>
      <stop offset="45%" stop-color="#07192f"/>
      <stop offset="75%" stop-color="#0b2c48"/>
      <stop offset="100%" stop-color="#0f3b5e"/>
    </linearGradient>

    <!-- Terrestrial terrain gradient (Eastern Ghats & delta plains) -->
    <linearGradient id="terrainGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0d2319"/>
      <stop offset="35%" stop-color="#143d2c"/>
      <stop offset="65%" stop-color="#1b543c"/>
      <stop offset="100%" stop-color="#246e4e"/>
    </linearGradient>

    <!-- Godavari River water flow gradient -->
    <linearGradient id="riverGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0ea5e9"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Atmospheric limb / sunrise glow -->
    <radialGradient id="atmoGlow" cx="80%" cy="10%" r="70%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.45)"/>
      <stop offset="30%" stop-color="rgba(14, 165, 233, 0.25)"/>
      <stop offset="60%" stop-color="rgba(6, 78, 119, 0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="50%" r="60%">
      <stop offset="40%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(4, 11, 23, 0.85)"/>
    </radialGradient>
  </defs>

  <!-- Deep Ocean Baseline (Bay of Bengal) -->
  <rect width="1600" height="640" fill="url(#oceanGrad)"/>

  <!-- Orbital Atmospheric Limb -->
  <circle cx="1280" cy="-300" r="1100" fill="url(#atmoGlow)"/>

  <!-- Andhra Pradesh Coastal Landmass Polygon -->
  <path d="M 0,0 L 980,0 Q 940,120 890,210 Q 820,310 920,440 Q 990,520 1100,640 L 0,640 Z" fill="url(#terrainGrad)" opacity="0.95"/>

  <!-- Eastern Ghats Topographic Ridges (Contour bands) -->
  <path d="M 0,80 Q 240,110 380,60 T 720,130 Q 810,180 840,90 L 890,0 L 0,0 Z" fill="#091b13" opacity="0.6"/>
  <path d="M 0,160 Q 200,220 340,170 T 640,240 Q 760,280 820,210 L 890,120 L 0,120 Z" fill="#0f2b1d" opacity="0.45"/>
  <path d="M 0,310 Q 180,360 300,320 T 580,410 Q 700,430 780,380 L 850,290 L 0,260 Z" fill="#153a27" opacity="0.35"/>

  <!-- Lower Godavari River Main Channel (Bhadrachalam -> Rajamahendravaram -> Dowleswaram -> Delta Mouths) -->
  <path d="M 280,0 Q 320,80 390,140 T 480,260 Q 520,320 620,380 T 740,460 Q 800,490 890,540 T 1040,640" 
        fill="none" stroke="url(#riverGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

  <!-- Gautami Godavari Branch (East) -->
  <path d="M 740,460 Q 820,480 910,510 T 1060,560 Q 1120,580 1180,640" 
        fill="none" stroke="url(#riverGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>

  <!-- Vashishta Godavari Branch (West) -->
  <path d="M 740,460 Q 760,510 790,550 T 840,640" 
        fill="none" stroke="url(#riverGrad)" stroke-width="10" stroke-linecap="round" opacity="0.85"/>

  <!-- Hydrographic Delta Tributaries & Backwaters -->
  <path d="M 620,380 Q 670,390 710,430 T 760,490" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.6"/>
  <path d="M 480,260 Q 430,290 380,310 T 320,360" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.5"/>
  <path d="M 890,540 Q 940,550 990,590 T 1030,640" fill="none" stroke="#7dd3fc" stroke-width="5" opacity="0.7"/>

  <!-- Key Geographic Markers (Dowleswaram Barrage, Rajamahendravaram, Bhadrachalam) -->
  <g transform="translate(740, 460)">
    <circle r="6" fill="#38bdf8"/>
    <circle r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
    <text x="18" y="4" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">DOWLESWARAM BARRAGE (CWC)</text>
    <text x="18" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">16.942° N, 81.776° E • Crest 14.94m</text>
  </g>

  <g transform="translate(620, 370)">
    <circle r="5" fill="#10b981"/>
    <circle r="12" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
    <text x="-160" y="-2" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">RAJAMAHENDRAVARAM</text>
    <text x="-160" y="10" font-family="system-ui, sans-serif" font-size="9" fill="#94a3b8">Urban &amp; Rural Delta Hub</text>
  </g>

  <g transform="translate(390, 140)">
    <circle r="4" fill="#38bdf8"/>
    <text x="14" y="3" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#e2e8f0">Bhadrachalam Station</text>
  </g>

  <!-- Orbital Telemetry Grid Lines -->
  <line x1="0" y1="200" x2="1600" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="0" y1="400" x2="1600" y2="400" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="400" y1="0" x2="400" y2="640" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="800" y1="0" x2="800" y2="640" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,8"/>
  <line x1="1200" y1="0" x2="1200" y2="640" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4,8"/>

  <!-- Coastal lights / Bay of Bengal label -->
  <text x="1350" y="580" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.25)" letter-spacing="4">BAY OF BENGAL</text>

  <!-- Outer Vignette Overlay -->
  <rect width="1600" height="640" fill="url(#vignette)"/>
</svg>
