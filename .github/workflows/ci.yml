name: PRAVAH 360 CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Unit Tests & Lint Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Offline Unit Tests
        run: |
          python -m unittest tests/test_ahp_consistency_and_weights.py tests/test_flood_risk_assessment.py tests/test_geographic_identification.py tests/test_flood_data_validation.py tests/test_pravah_auth.py tests/test_weather_and_location_service.py

      - name: Start FastAPI Background Service
        run: |
          python -m uvicorn backend.app.main:app --port 8000 &
          sleep 3

      - name: Run Full Test Suite (Unit + Integration)
        run: |
          python -m unittest discover tests/
