<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4D45" />
      <stop offset="100%" stop-color="#0E2824" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="10" y1="15" x2="90" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D7A94D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#264D67" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D7A94D" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="riverGrad" x1="30" y1="25" x2="70" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5F0E8" />
      <stop offset="45%" stop-color="#D7A94D" />
      <stop offset="100%" stop-color="#264D67" />
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0E2824" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular Outer 360 Surveillance Halo Ring -->
  <circle cx="50" cy="50" r="44" stroke="#D7A94D" stroke-width="1.2" stroke-dasharray="3 4" stroke-opacity="0.5" />

  <!-- 360-Degree Tilted Orbital Ellipse -->
  <ellipse cx="50" cy="50" rx="46" ry="18" transform="rotate(-28 50 50)" stroke="url(#orbitGrad)" stroke-width="2.2" />

  <!-- Orbital Node Satellite (Earth Observation Sensor) -->
  <circle cx="88" cy="30" r="3.2" fill="#D7A94D" filter="url(#softGlow)" />
  <circle cx="88" cy="30" r="1.5" fill="#FFFFFF" />

  <!-- Central Earth Sphere Body -->
  <circle cx="50" cy="50" r="32" fill="url(#globeGrad)" filter="url(#softGlow)" />

  <!-- Globe Latitudinal Lines -->
  <path d="M22 50 A28 10 0 0 1 78 50" stroke="#E5F0E8" stroke-width="0.8" stroke-opacity="0.22" stroke-dasharray="2 2" fill="none" />
  <path d="M26 38 A24 7 0 0 1 74 38" stroke="#E5F0E8" stroke-width="0.8" stroke-opacity="0.18" fill="none" />
  <path d="M26 62 A24 7 0 0 1 74 62" stroke="#E5F0E8" stroke-width="0.8" stroke-opacity="0.18" fill="none" />

  <!-- Globe Longitudinal Meridians -->
  <ellipse cx="50" cy="50" rx="14" ry="32" stroke="#E5F0E8" stroke-width="0.9" stroke-opacity="0.22" fill="none" />
  <line x1="50" y1="18" x2="50" y2="82" stroke="#E5F0E8" stroke-width="0.9" stroke-opacity="0.22" />

  <!-- Flowing River Stream ("PRAVAH" - Dynamic Meandering Water Flow) -->
  <path d="M72 26 C64 34, 58 38, 48 44 C38 50, 32 58, 27 74 C31 71, 38 65, 46 58 C56 50, 66 42, 75 31 Z" fill="url(#riverGrad)" />

  <!-- Secondary Ripple Wave Accent -->
  <path d="M68 34 C60 41, 54 46, 44 52 C37 57, 33 63, 30 71" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.8" fill="none" />
  <path d="M71 42 C65 47, 59 52, 52 57" stroke="#D7A94D" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Core Pulsing Node -->
  <circle cx="48" cy="48" r="2.2" fill="#D7A94D" />
</svg>
